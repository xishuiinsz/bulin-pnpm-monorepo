<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP：只允许同源脚本/样式，避免 Electron 安全告警 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>儿童守护中心</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>儿童守护中心</h1>
      <p class="subtitle">Electron 主进程 ↔ Windows PowerShell 交互示例</p>
    </header>

    <main>
      <div class="toolbar">
        <button id="refresh" type="button">刷新系统信息</button>
        <span id="status" class="status">等待读取…</span>
      </div>
      <section id="info" class="info"></section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
